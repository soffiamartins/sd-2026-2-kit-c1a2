syntax = "proto3";

package inferencia;

service Classificador {
    rpc Prever (RequisicaoTexto) returns (RespostaClassificacao);
    rpc PreverLote (RequisicaoLote) returns (RespostaLote);
}

message RequisicaoTexto {
    string texto = 1;
}

message RespostaClassificacao {
    string sentimento = 1;
    float confianca = 2;
}

message RequisicaoLote {
    repeated string textos = 1;
}

message RespostaLote {
    repeated RespostaClassificacao resultados = 1;
}